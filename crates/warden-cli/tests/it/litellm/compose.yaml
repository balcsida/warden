---
# Throwaway LiteLLM OSS proxy for crates/warden-cli/tests/it_litellm.rs.
# Placeholder credentials only. `docker compose -f compose.yaml up -d --wait`
services:
  db:
    image: postgres:16-alpine
    container_name: wit-litellm-db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    ports: ["54329:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 2s
      retries: 30
  litellm:
    image: ghcr.io/berriai/litellm:v1.106.6
    container_name: wit-litellm-proxy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
    volumes: ["./config.yaml:/app/config.yaml:ro"]
    ports: ["14000:4000"]
