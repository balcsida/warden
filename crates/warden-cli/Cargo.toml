[package]
name = "warden-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "warden: harness-neutral launcher for agentic coding tools"

[[bin]]
name = "warden"
path = "src/main.rs"

[features]
default = ["otlp"]
otlp = ["warden-audit/otlp"]

[lints]
workspace = true

[dependencies]
warden-core.workspace = true
warden-policy.workspace = true
warden-sandbox.workspace = true
warden-provider.workspace = true
warden-identity.workspace = true
warden-audit.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
url.workspace = true
tempfile.workspace = true
reqwest.workspace = true
tiny_http = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest.workspace = true
base64 = "0.22"
