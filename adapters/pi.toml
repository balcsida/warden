# Pi (https://pi.dev). Sources: packages/coding-agent/src/config.ts,
# docs/environment-variables.md, docs/models.md, and the pi-provider-litellm README.

[harness]
id = "pi"
name = "Pi"
executable = "pi"
version_args = ["--version"]
min_version = "0.99.2"
install_hint = "npm install -g @earendil-works/pi-coding-agent"

[home]
env = "PI_CODING_AGENT_DIR"
default = "${WARDEN_DATA}/homes/pi"

# Preferred: first-class LiteLLM support through the pi-provider-litellm extension.
# The key goes in LITELLM_API_KEY rather than LITELLM_API_KEY_HELPER: the extension
# refuses to run a key helper during activation, and `pi -p` never refreshes later,
# so helper-only auth has no models in print mode (src/index.ts seedModels). Switch to
# key_helper_env = "LITELLM_API_KEY_HELPER" once the extension can opt in to that.
[inject.litellm]
base_url_env = "LITELLM_BASE_URL"
key_env = "LITELLM_API_KEY"
model_args = ["--model", "litellm/${model}"]
extra_env = { LITELLM_MODELS_DEV = "0" }
requires = ["extension:pi-provider-litellm"]

# Fallbacks for plain gateways; base URL goes through the emitted models.json.
[inject.anthropic-messages]
key_env = "ANTHROPIC_API_KEY"
native_api = "anthropic-messages"
model_args = ["--model", "warden/${model}"]
extra_env = { PI_OFFLINE = "1" }

[inject.openai-responses]
key_env = "OPENAI_API_KEY"
native_api = "openai-responses"
model_args = ["--model", "warden/${model}"]
extra_env = { PI_OFFLINE = "1" }

[inject.openai-chat]
key_env = "OPENAI_API_KEY"
native_api = "openai-completions"
model_args = ["--model", "warden/${model}"]
extra_env = { PI_OFFLINE = "1" }

# PI_OFFLINE would also stop pi-provider-litellm's model discovery, so it is set only
# on the non-LiteLLM tables; Pi's own catalog refresh to pi.dev is blocked by the proxy.
[env]
PI_SKIP_VERSION_CHECK = "1"
PI_TELEMETRY = "0"

[[net]]
host = "pi.dev"
purpose = "catalog"
default = "deny"

[[net]]
host = "api.github.com"
purpose = "share"
default = "deny"

[[net]]
host = "registry.npmjs.org"
purpose = "update-check"
default = "deny"

[[emit]]
path = "${home}/models.json"
format = "json"
merge = "replace-key"
key = "providers.warden"
when_format = ["anthropic-messages", "openai-responses", "openai-chat"]
template = '''
{
  "name": "warden",
  "baseUrl": "${base_url}",
  "api": "${api}",
  "apiKey": "$$${key_env}",
  "models": [ { "id": "${model}", "name": "${model}", "reasoning": true } ]
}
'''
