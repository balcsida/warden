name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  # Unit tests plus the sandbox integration tests on every supported OS: macOS and
  # Linux check read/write/connect blocking, Windows (tests/sandbox_windows.rs)
  # checks the write limit, ACL idempotence, exit codes and process-tree kill.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
          - os: macos-15
          - os: ubuntu-26.04
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; the
          # sandbox needs them. This mirrors what a managed fleet would configure.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # the lint job runs on Linux and never compiles cfg(windows) code
      - name: Clippy (Windows code)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Linux sandbox smoke (bwrap present, unshare works)
        if: runner.os == 'Linux'
        run: bwrap --unshare-net --ro-bind / / --dev /dev --proc /proc -- /bin/true

  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p warden-cli
