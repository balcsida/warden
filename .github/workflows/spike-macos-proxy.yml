name: spike-macos-proxy
on:
  push:
    branches: ['spike/**']
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
        rep: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash .github/spike/macos-proxy4.sh 8 6
      - run: bash .github/spike/macos-proxy6.sh 20
      - run: bash .github/spike/macos-proxy10.sh 120
      - run: bash .github/spike/macos-warden-loop.sh 100
      - name: summary
        if: always()
        run: |
          echo "SUMMARY ${{ matrix.os }} rep ${{ matrix.rep }} $(sw_vers -productVersion)"
          echo "SUMMARY e4 failing connects: $(grep -c '   fail' spike-out/results4.txt)"
          grep -E "variant=" spike-out/results4.txt | grep -v fail | awk '{print "SUMMARY e4", $3, $5, $6}' | sort | uniq -c | head -0
          sed 's/^/SUMMARY e6 /' spike-out/summary6.txt
          sed 's/^/SUMMARY e10 /' spike-out/summary10.txt
          sed 's/^/SUMMARY warden /' spike-out/warden-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ matrix.os }}-${{ matrix.rep }}
          path: spike-out
