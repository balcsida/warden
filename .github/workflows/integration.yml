name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # warden's OTLP audit exporter against a real OpenTelemetry Collector.
  otlp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; the
          # sandbox needs them. This mirrors what a managed fleet would configure.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Start collector
        # Not a service container: it needs the repo's config file mounted. Run as
        # the runner's uid so the host test can read the file the collector writes.
        run: |
          mkdir -p "$RUNNER_TEMP/otlp-out"
          docker run -d --name wit-otlp-collector --user "$(id -u):$(id -g)" \
            -p 14318:4318 \
            -v "$PWD/crates/warden-cli/tests/it/otlp/collector.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "$RUNNER_TEMP/otlp-out:/out" \
            otel/opentelemetry-collector-contrib:0.164.0
          for _ in $(seq 30); do
            # 401 without the bearer token means the receiver is up.
            [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:14318/v1/logs)" = 401 ] && exit 0
            sleep 1
          done
          docker logs wit-otlp-collector
          exit 1
      - run: cargo test -p warden-cli --test it_otlp -- --nocapture
        env:
          WARDEN_IT_OTLP_ENDPOINT: http://127.0.0.1:14318/v1/logs
          WARDEN_IT_OTLP_FILE: ${{ runner.temp }}/otlp-out/logs.json
      - name: Collector logs
        if: failure()
        run: docker logs wit-otlp-collector
